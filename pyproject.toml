[project]
name = "findly-ai"
version = "2.0.0"
description = "Production-grade Autonomous AI Research Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "langgraph>=0.2.0",
    "lxml>=5.0.0",
    "orjson>=3.10.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "tavily-python>=0.3.0",
    "tenacity>=8.2.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
